<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1418" />
    <meta name="description" content="Kingdoms of Aldmoor — a 16-bit world on a small screen. Hoffender is the first hold. The Frostmere Wilds lie outside its gate." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aldmoor" />
    <title>Kingdoms of Aldmoor</title>
    <link rel="icon" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="app" data-layout="portrait">
      <div id="map-slot"></div>
      <div id="hud"></div>
      <p id="toast" hidden></p>
      <div id="panel" hidden></div>
      <div id="gate">
        <div class="gate-card create-card">
          <p class="eyebrow">Kingdoms of Aldmoor</p>
          <h1>Create</h1>
          <p class="lede">A Barbarian walks out of Hoffender. Warrior, Shaman, Rogue, Berserker, and Warden are ready. Wizard is not a Barbarian path.</p>
          <div id="save-row" hidden>
            <p id="save-summary"></p>
            <button id="continue-btn" type="button">Continue</button>
            <button id="new-char" type="button">New character</button>
          </div>
          <p id="confirm-new" hidden>Erase the saved hero and begin again? <button id="confirm-new-yes" type="button">Erase and begin</button> <button id="confirm-new-no" type="button">Keep the save</button></p>
          <p id="wizard-note" hidden></p>
          <div id="create-form">
          <h2>Body</h2>
          <div id="sex-pick" class="pick-grid" role="radiogroup" aria-label="Body"></div>
          <h2>Race</h2>
          <div id="race-pick" class="pick-grid" role="radiogroup" aria-label="Race"></div>
          <h2>Class</h2>
          <div id="class-pick" class="pick-grid" role="radiogroup" aria-label="Class"></div>
          <p id="class-blurb"></p>
          <h2>Stats</h2>
          <p id="points" class="points">Bonus points left: 6</p>
          <ul id="stat-list" class="stat-list"></ul>
          <button id="enter" type="button">Enter Hoffender</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
